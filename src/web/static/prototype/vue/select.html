<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[Vue 3] 选择并分析</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script type="module" src="./vue-app.js"></script>
</head>
<body data-framework="vue">
  <div id="app" class="container">
    <h1>选择音频并分析（Vue 3 版）</h1>
    <div class="prototype-links">
      <a href="./index.html">返回历史记录</a>
    </div>

    <div class="card">
      <label>目录路径：
        <input type="text" v-model="scanPath" style="width: 400px;" />
      </label>
      <button class="btn" @click="scan" :disabled="scanning">{{ scanning ? '扫描中...' : '扫描' }}</button>

      <div class="file-list" v-if="files.length">
        <label class="file-item" v-for="f in files" :key="f.path">
          <input type="checkbox" :value="f.path" v-model="selected" />
          {{ f.name }}
        </label>
      </div>
      <p v-else-if="scanned">未找到音频文件</p>

      <button class="btn" @click="analyze" :disabled="!selected.length || analyzing">分析选中文件</button>

      <div class="progress" v-if="progress.show">
        <div>{{ progress.message }}</div>
        <div class="progress-bar" :style="{ width: progress.percent + '%' }"></div>
      </div>
    </div>
  </div>
</body>
</html>
