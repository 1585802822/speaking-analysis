<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[Element Plus] 录音分析 Web UI</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/vendor/element-plus.css" />
  <script src="/static/vendor/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus.full.min.js"></script>
  <script type="module" src="./element-app.js"></script>
</head>
<body data-framework="element">
  <div id="app" class="container">
    <h1>Vue 3 + Element Plus 版</h1>
    <div class="prototype-links">
      <a href="/">返回首页</a>
      <a href="./select.html">选择文件分析</a>
    </div>

    <el-card>
      <template #header>
        <span>分析历史记录</span>
      </template>
      <el-table :data="recordings" v-if="recordings.length">
        <el-table-column prop="id" label="ID"></el-table-column>
        <el-table-column label="文件">
          <template #default="{ row }">
            <span :title="row.original_path">{{ basename(row.original_path) }}</span>
          </template>
        </el-table-column>
        <el-table-column label="状态">
          <template #default="{ row }">
            <el-tag :type="statusType(row.status)">{{ statusText(row.status) }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="时长">
          <template #default="{ row }">{{ formatTime(row.duration_sec) }}</template>
        </el-table-column>
        <el-table-column label="处理时间">
          <template #default="{ row }">{{ formatDateTime(row.processed_at) }}</template>
        </el-table-column>
        <el-table-column label="操作">
          <template #default="{ row }">
            <el-button size="small" type="primary"
              @click="location.href='./edit.html?recording_id=' + row.id"
            >编辑</el-button>
          </template>
        </el-table-column>
      </el-table>
      <p v-else>暂无分析记录</p>
    </el-card>
  </div>
</body>
</html>
