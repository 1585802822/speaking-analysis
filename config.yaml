# 日常录音分析工具配置

input_dir: "./data/input"
output_dir: "./data/output"
voiceprint_dir: "./data/voiceprint"
segments_dir: "./data/segments"
db_path: "./data/db/speaking_analysis.db"
audio_formats: [".mp3", ".wav", ".m4a", ".flac"]

preprocessing:
  denoise:
    backend: noisereduce  # noisereduce | rnnoise | spectral
    noise_sample_sec: 0.1  # 仅 spectral 使用
  vad:
    backend: silero       # silero | energy
    min_speech_duration_ms: 250
    max_silence_duration_ms: 1000
    threshold: 0.5        # silero 置信度阈值
  segmentation:
    target_sample_rate: 16000
    min_segment_duration_sec: 10
    max_segment_duration_sec: 300
  speaker_filter:
    enabled: true
    # 阈值按 ECAPA-TDNN 实测分布校准(同人典型 0.48-0.7, 静音/异人≈0)
    similarity_threshold: 0.40
    low_confidence_threshold: 0.25

sentence_segmentation:
  target_sample_rate: 16000
  min_sentence_sec: 0.5       # 单句最短时长
  max_sentence_sec: 15.0      # 单句最长时长
  pause_threshold_sec: 0.7    # 超过该时长的停顿视为句边界
  min_pause_sec: 0.2          # 最短有效停顿
  target_sentence_sec: 2.0    # 目标句长：短于它的相邻句且间隔 < pause_threshold_sec 时合并
  padding_sec: 0.1            # 导出时前后保留的静音

speaker:
  enrollment_duration_sec: 45
  similarity_threshold: 0.40
  low_confidence_threshold: 0.25
  positive_lr: 0.25
  negative_lr: 0.15
  embedding_model: "speechbrain/spkrec-ecapa-voxceleb"
  embedding_model_cache: "./tmp/spkrec-ecapa-voxceleb"
  pyannote_embedding_model: "pyannote/embedding"
  # 注册声纹时的分块与能量 VAD 参数
  enroll_chunk_sec: 3.0
  enroll_vad_energy_db: 40

asr:
  model: "large-v3"
  device: "auto"
  compute_type: "int8"
  language: "zh"
  beam_size: 5
  vad_filter: true

analysis:
  filler_words:
    zh: ["嗯", "啊", "然后", "就是", "那个", "这个", "对吧", "所以", "那么"]
    en: ["um", "uh", "like", "you know", "so", "actually", "basically", "well"]
  max_sentence_words: 45
  min_pause_sec: 0.3
  max_pause_sec: 2.0
  pronunciation:
    low_confidence_threshold: 0.65
    phoneme_check: true
    # 语音评测（ISE）总分达到该值视为"发音标准"
    standard_threshold: 80

reporting:
  formats: ["markdown", "json"]

# API 配置（MVP 默认启用讯飞开放平台）
api:
  enabled: true
  provider: "iflytek"  # gateway 统一网关 | iflytek 讯飞开放平台
  base_url: "https://your-ai-gateway.example.com"
  api_key_env: "AI_GATEWAY_API_KEY"
  timeout: 120
  # 讯飞开放平台配置
  # 密钥优先从环境变量读取，环境变量名如下；
  # 也可直接在下方填写（不推荐，避免提交真实密钥）。
  iflytek:
    mode: "llm"  # long 录音文件转写（标准版） | stream 语音听写（流式版） | llm 录音文件转写（大模型版 Ifasr_llm）
    app_id: ""
    app_id_env: "IFLYTEK_APP_ID"
    api_key: ""  # stream/llm 模式需要（作为 accessKeyId）
    api_key_env: "IFLYTEK_API_KEY"
    api_secret: ""
    api_secret_env: "IFLYTEK_API_SECRET"
    language: "autodialect"  # long: cn/en; stream: zh_cn/en_us; llm: autodialect 中英+方言 / autominor 多语种
    # 发音评测配置
    evaluation:
      # mode: ise 语音评测（流式版 WebSocket）| voice_insight Spark VAA 语音分析（HTTP）
      # 注意：voice_insight 需要公网可访问的音频外链 audioFileURL，普通内网机器需自行解决外链
      mode: "ise"
      app_id: ""
      app_id_env: "IFLYTEK_APP_ID"
      api_key: ""  # 两种模式鉴权均需 APIKey
      api_key_env: "IFLYTEK_API_KEY"
      api_secret: ""  # 两种模式鉴权均需 APISecret（HMAC-SHA256 签名）
      api_secret_env: "IFLYTEK_API_SECRET"
      # 评测题型：read_syllable | read_word | read_sentence（仅 ise 模式使用）
      category: "read_sentence"
      language: "cn"  # cn 中文, en 英文（仅 ise 模式使用）
      # Spark VAA 大模型代码（voice_insight 模式使用）：xdeepseekv31 | x1 | 4.0ultra
      model_code: "xdeepseekv31"
  endpoints:
    asr: "/v1/audio/transcriptions"
    embed: "/v1/audio/embeddings"
