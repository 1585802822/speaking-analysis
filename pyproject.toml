[project]
name = "speaking-analysis"
version = "0.2.0"
description = "本地日常录音分析工具"
readme = "README.md"
authors = [
    { name = "Jas", email = "1585802822@qq.com" },
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "click>=8.0",
    "watchdog>=3.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pydub>=0.25",
    "faster-whisper>=1.0.0",
    "pyannote.audio>=3.0",
    "speechbrain>=0.5.16",
    "transformers>=4.30",
    "torch>=2.0,<2.6",
    "torchaudio>=2.0,<2.6",
    "pypinyin>=0.50",
    "phonemizer>=3.2",
    "jinja2>=3.1",
    "requests>=2.31",
    "websocket-client>=1.6",
    "noisereduce>=3.0",
    "silero-vad>=4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.uv]
package = false
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
